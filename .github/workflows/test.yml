name: Validate Shoes manager

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:24.04', 'alpine:3.22']
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests and released-core proxy traffic
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TEST_IMAGE" sh -ec '
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache bash curl ca-certificates tar gzip openssl jq coreutils iproute2 util-linux python3 shellcheck
            else
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y bash curl ca-certificates tar gzip openssl jq coreutils iproute2 util-linux python3 shellcheck
            fi
            bash -n shoes.sh
            bash -n domainlist.sh
            shellcheck shoes.sh domainlist.sh
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
            python3 tests/live_smoke.py
          '
